<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <h1>Tic-Tac-Toe Game - Configuracion de jugadores</h1>
    <h1>Aqui ira el diseno de la configuracion de jugadores</h1>
    <form action="">
        <label for="player1">Jugador 1:</label>
        <input type="text" id="player1" name="player1" required>
        <br>
        <label for="player2">Jugador 2:</label>
        <input type="text" id="player2" name="player2" required>
        <br>
    </form>
    <div class="btn-group">
        <button id="startBtn">Iniciar partida</button>
    </div>
</body>
</html>
