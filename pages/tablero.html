<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <section class="im">
      <div class="player-indicator">
        <button id="player1" class="player-button active">Jugador 1</button>
        <span class="ficha" id="ficha-player1">x</span>
      </div>
      <div class="player-indicators">
        <button id="player2" class="player-button active">Jugador 2</button>
        <span class="ficha" id="ficha-player2">o</span>
      </div>

      <div class="im">
        <img src="/assets/img/logo.png" alt="Tic-Tac-Toe" class="imagen" />
      </div>

      <div id="contador">Turno: <span id="name_player"></span></div>
      <div id="tablero"></div>

      <p>
        Array del tablero:
        <span class="array" id="tablero-estado"
          >[null, null, null, null, null, null, null, null, null]</span
        >
      </p>
    </section>
    <script src="/js/tablero.js"></script>
  </body>
</html>
